<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline Chess</title>
<style>
/*{{CSS}}*/
</style>
</head>
<body>
<!--{{PIECES}}-->
<header>
  <h1>Offline Chess</h1>
  <span>Play Stockfish offline. Everything is in this one file; no internet needed.</span>
</header>
<main>
  <div id="board-col">
    <div id="board-row">
      <div id="evalbar" title="Evaluation: who is ahead"><div id="evalfill"></div><div id="evalnum"></div></div>
      <div id="board-wrap">
        <div id="board"></div>
        <div id="promo" hidden></div>
      </div>
    </div>
  </div>
  <aside id="side">
    <div class="tray" id="tray-top"></div>
    <div class="clock" id="clock-top"></div>
    <div id="panel">
      <div class="player" id="player-top"><span class="dot"></span><span class="name"></span></div>
      <div id="nav">
        <button id="nav-first" title="First move (Up arrow)">&#x23EE;&#xFE0E;</button>
        <button id="nav-prev" title="Previous move (Left arrow)">&#x25C0;&#xFE0E;</button>
        <button id="nav-next" title="Next move (Right arrow)">&#x25B6;&#xFE0E;</button>
        <button id="nav-last" title="Last move (Down arrow)">&#x23ED;&#xFE0E;</button>
        <button id="nav-flip" title="Flip board (F)">&#x21C5;</button>
      </div>
      <div id="moves"></div>
      <div id="info">
        <div id="status"></div>
        <div id="score"></div>
      </div>
      <div id="actions">
        <button id="btn-takeback" title="Take back your last move">&#x21B6; Takeback</button>
        <button id="btn-resign" title="Resign the game">&#x2691;&#xFE0E; Resign</button>
        <button id="btn-new">New game</button>
      </div>
      <div class="player" id="player-bottom"><span class="dot"></span><span class="name"></span></div>
    </div>
    <div class="clock" id="clock-bottom"></div>
    <div class="tray" id="tray-bottom"></div>
    <div id="extras">
      <button id="btn-eval">Eval bar and score</button>
      <button id="btn-mscore">Score of each move</button>
      <button id="btn-sound">Sound</button>
      <button id="btn-pgn">Copy PGN</button>
    </div>
  </aside>
</main>

<dialog id="setup">
  <h2>Play with the computer</h2>
  <h3>Computer's rating</h3>
  <div id="elo-value"></div>
  <input type="range" id="elo">
  <div id="elo-scale"><span>400</span><span>beginner</span><span>club</span><span>master</span><span>Max</span></div>
  <p id="elo-note"></p>
  <h3>Time: minutes per side + seconds added each move</h3>
  <div id="times"></div>
  <div id="custom-time" hidden>
    <label>Minutes <input type="number" id="tc-min" min="1" max="180" value="20"></label>
    <label>Seconds added <input type="number" id="tc-inc" min="0" max="60" value="10"></label>
  </div>
  <h3>Choose your side</h3>
  <div id="sides">
    <button data-side="black" title="Black"><svg viewBox="0 0 40 40"><use href="#bk"/></svg></button>
    <button data-side="random" class="big" title="Random side"><span class="half"><svg viewBox="0 0 40 40"><use href="#wk"/></svg><svg viewBox="0 0 40 40"><use href="#bk"/></svg></span></button>
    <button data-side="white" title="White"><svg viewBox="0 0 40 40"><use href="#wk"/></svg></button>
  </div>
  <button class="close" id="setup-close">Cancel</button>
</dialog>

<!--
  Stockfish (GPLv3), embedded so the game needs no network.
  Stockfish.js 19 lite, single-threaded: https://github.com/nmrugg/stockfish.js
  Stockfish: https://github.com/official-stockfish/Stockfish
-->
<script id="sf-wasm" type="text/plain">/*{{SF_WASM}}*/</script>
<script id="sf-js" type="text/plain">/*{{SF_JS}}*/</script>
<script id="engine-src">
/*{{ENGINE}}*/
</script>
<script>
/*{{UI}}*/
</script>
</body>
</html>
