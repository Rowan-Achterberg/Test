# Launch each Windows executable on real Windows machines (ARM64 and x64),
# check that it starts and stays running, and save a screenshot.
name: windows-smoke

on:
  push:
    paths: ['tanks/**', 'mines/**', '.github/workflows/windows-smoke.yml']
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-11-arm, exe: tanks/release/tanks-arm64.exe, name: tanks-arm64, keys: '{ENTER}' }
          - { os: windows-latest, exe: tanks/release/tanks-amd64.exe, name: tanks-amd64, keys: '{ENTER}' }
          - { os: windows-11-arm, exe: mines/release/mines-arm64.exe, name: mines-arm64, keys: ' ' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Launch and observe
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path)
            # report how many distinct colours are on screen, as a rough sign that something was drawn
            $seen = @{}
            for ($y = 0; $y -lt $bmp.Height; $y += 16) { for ($x = 0; $x -lt $bmp.Width; $x += 16) { $seen[$bmp.GetPixel($x, $y).ToArgb()] = 1 } }
            Write-Host "screenshot $path : $($b.Width)x$($b.Height), $($seen.Count) distinct sampled colours"
            $g.Dispose(); $bmp.Dispose()
          }
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)  arch: $env:PROCESSOR_ARCHITECTURE"
          $exe = Resolve-Path "${{ matrix.exe }}"
          Write-Host "file: $exe  size: $((Get-Item $exe).Length) bytes"
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { Write-Host "FAILED: process exited within 5 s, exit code $($p.ExitCode) (0x$('{0:X8}' -f $p.ExitCode))"; exit 1 }
          Write-Host "running after 5 s: pid $($p.Id), window title '$($p.MainWindowTitle)', handle $($p.MainWindowHandle), responding $($p.Responding)"
          Shot "shots\${{ matrix.name }}-1.png"
          $shell = New-Object -ComObject WScript.Shell
          $null = $shell.AppActivate($p.Id)
          Start-Sleep -Milliseconds 500
          [System.Windows.Forms.SendKeys]::SendWait("${{ matrix.keys }}")
          Start-Sleep -Seconds 4
          $p.Refresh()
          if ($p.HasExited) { Write-Host "FAILED: process exited after key press, exit code $($p.ExitCode) (0x$('{0:X8}' -f $p.ExitCode))"; exit 1 }
          Write-Host "still running after key press, responding $($p.Responding), working set $([int]($p.WorkingSet64 / 1MB)) MB"
          Shot "shots\${{ matrix.name }}-2.png"
          Stop-Process -Id $p.Id -Force
          if ($p.MainWindowHandle -eq 0) { Write-Host "FAILED: no window appeared"; exit 1 }
          Write-Host "OK"
      - name: Recent application crashes, if any
        if: always()
        shell: powershell
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
            Select-Object -First 3 | ForEach-Object { Write-Host $_.Message }
          Write-Host "done"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-screenshots
          path: shots
          if-no-files-found: ignore
